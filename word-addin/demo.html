<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cek Sitasi Demo</title>
  <style>
    :root { --bg:#E9ECF2; --page:#fff; --text:#1b1f29; --dim:#5B6478; --accent:#0A7986; --line:#D6DCE8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101319; --page:#1b1f27; --text:#e7eaf1; --dim:#9aa3b6; --accent:#4FD0D6; --line:#2b3140; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", -apple-system, Roboto, sans-serif; display:flex; height:100vh; }
    .docwrap { flex:1; overflow:auto; padding:24px 16px; min-width:0; }
    .bar { max-width:760px; margin:0 auto 10px; display:flex; gap:10px; align-items:center; color:var(--dim); font-size:12px; flex-wrap:wrap; }
    .bar select, .bar button { font:inherit; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--page); color:var(--text); }
    .page { max-width:760px; margin:0 auto; background:var(--page); padding:48px 56px; box-shadow:0 1px 3px rgba(0,0,0,.12); font-family: "Times New Roman", Georgia, serif; font-size:15px; }
    .page p { margin:0 0 10px; outline:none; border-radius:3px; }
    .page p:focus { box-shadow:0 0 0 2px var(--accent); }
    .page p.heading { font-weight:700; margin-top:16px; }
    .page p.ref { padding-left:36px; text-indent:-36px; }
    .page a { color:inherit; text-decoration: underline dotted var(--accent); }
    .page a.ext { color:#2C64C9; text-decoration:underline; }
    .page .hl { background:#FFF59D; color:#000; }
    .page .sel { background:rgba(10,121,134,.22); outline:2px solid var(--accent); }
    .page p.inserted { background: rgba(108,92,214,.08); }
    .pane { width:380px; flex:none; border-left:1px solid var(--line); background:#fff; }
    .pane iframe { width:100%; height:100%; border:0; }
    @media (max-width:760px) { body { flex-direction:column; height:auto; } .pane { width:100%; height:80vh; } .page { padding:24px 18px; } }
  </style>
</head>
<body>
  <div class="docwrap">
    <div class="bar">
      <span><b>Mode demo</b> — dokumen tiruan di kiri, panel add-in di kanan. Klik paragraf untuk mengedit.</span>
      <select id="sample"><option value="apa">Contoh naskah APA 7</option><option value="ieee">Contoh naskah IEEE</option></select>
    </div>
    <div id="newDocNote" class="bar" hidden><b>Dokumen baru: salinan tertaut</b> — di Word, ini dibuka di jendela terpisah. Klik sitasi bergaris titik untuk melompat.</div>
    <div id="page" class="page"></div>
  </div>
  <div class="pane"><iframe id="pane" title="Panel Cek Sitasi" src="taskpane.html?demo"></iframe></div>
  <script>
    var SAMPLES = {
      apa: [
        'Etika Kecerdasan Buatan dalam Pembelajaran Mesin',
        'Pendahuluan',
        'Pembelajaran mesin berkembang pesat (Smith & Jones, 2020). Menurut Brown et al. (2019), model besar membutuhkan data dalam jumlah sangat besar. Penelitian lain (Lee and Park, 2021; Adams, 2018) menunjukkan hal serupa.',
        'Garcia, Lopez, dan Chen (2022) membahas etika penerapan model tersebut. Studi terbaru tentang transformer untuk bahasa daerah (Wang, 2023) juga relevan, begitu pula korpus bahasa Bugis (Rahman, 2019).',
        'Daftar Pustaka',
        'Smith, J., & Jones, K. (2020). Deep learning for text classification. Journal of Machine Learning Research, 21(4), 1-20. https://doi.org/10.1234/jmlr.2020.004',
        'Brown, T., Mann, B., Ryder, N., & Subbiah, M. (2019). Language models are few-shot learners. Advances in Neural Information Processing Systems, 33, 1877-1901.',
        'Lee, H., and Park, S. (2021). Attention mechanisms revisited. Neural Networks, 140, 12–25.',
        'Garcia, M., Lopez, R., & Chen, L. (2022). Ethics in artificial intelligence. AI and Society, 37(2), 400–415. doi:10.1007/s00146-021-01234-5',
        'Adams, P. (2018). Statistical learning theory. Springer.',
        'Rahman A Korpus bahasa Bugis untuk pemrosesan bahasa alami Jurnal Linguistik Komputasional 2019'
      ],
      ieee: [
        'Attention Models for Low-Resource Languages',
        'I. Introduction',
        'Deep learning has advanced rapidly [1]. Brown et al. [3] showed that large models need data. Other studies [2, 4] agree, and attention was revisited in [5]-[6]. See also [9].',
        'References',
        '[1] J. Smith and K. Jones, "Deep learning for text classification," J. Mach. Learn. Res., vol. 21, no. 4, pp. 1-20, 2020, doi: 10.1234/jmlr.2020.004.',
        '[2] H. Lee and S. Park, "Attention mechanisms revisited," Neural Netw., vol. 140, pp. 12–25, 2021.',
        '[3] T. Brown, B. Mann, N. Ryder, and M. Subbiah, "Language models are few-shot learners," in Proc. Adv. Neural Inf. Process. Syst., 2019, pp. 1877–1901.',
        '[4] P. Adams, Statistical Learning Theory. New York, NY, USA: Springer, 2018.',
        '[5] M. Garcia, R. Lopez, and L. Chen, "Ethics in artificial intelligence," AI Soc., vol. 37, no. 2, pp. 400–415, 2022',
        '[6] Q. Zhou, "Unused reference example," Data Sci. J., vol. 14, pp. 1–9, 2015.'
      ]
    };
    var ITALIC = { apa: [[5, 'Journal of Machine Learning Research, 21'], [7, 'Neural Networks, 140'], [9, 'Statistical learning theory']], ieee: [[4, 'J. Mach. Learn. Res.'], [7, 'Statistical Learning Theory'], [6, 'Proc. Adv. Neural Inf. Process. Syst.']] };
    function build(name) {
      return SAMPLES[name].map(function (t, i) {
        var p = { runs: [{ text: t, italic: false }], links: [], bookmarks: [] };
        (ITALIC[name] || []).forEach(function (x) { if (x[0] === i) { var k = t.indexOf(x[1]); if (k >= 0) p.runs = [{ text: t.slice(0, k), italic: false }, { text: x[1], italic: true }, { text: t.slice(k + x[1].length), italic: false }]; } });
        return p;
      });
    }
    window.DemoDoc = { paragraphs: build('apa'), listeners: [], selection: null, track: false, changed: render };
    var HEAD = /^(?:[IVX]+\.\s+)?(?:Pendahuluan|Introduction|Daftar Pustaka|References)$/i;
    function textOf(p) { return p.runs.map(function (r) { return r.text; }).join(''); }
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function render() {
      var D = window.DemoDoc, page = document.getElementById('page'), afterRefs = false;
      document.getElementById('newDocNote').hidden = !D.newDocumentOpened;
      page.innerHTML = D.paragraphs.map(function (p, i) {
        var t = textOf(p), isHead = HEAD.test(t.trim()) || i === 0;
        if (/^(Daftar Pustaka|References)$/i.test(t.trim())) afterRefs = true;
        var marks = [];
        p.links.forEach(function (l) { marks.push({ s: l.start, e: l.start + l.len, open: '<a class="' + (/^#/.test(l.href) ? '' : 'ext') + '" href="' + esc(l.href) + '" title="' + esc(l.href) + '">', close: '</a>' }); });
        var sel = D.selection && D.selection.paraIndex === i ? D.selection : null;
        if (sel && sel.len) marks.push({ s: sel.start, e: sel.start + sel.len, open: '<span class="sel">', close: '</span>' });
        var html = '', acc = 0;
        p.runs.forEach(function (r) {
          for (var k = 0; k < r.text.length; k++) {
            var pos = acc + k;
            marks.forEach(function (m) { if (m.e === pos) html += m.close; });
            marks.forEach(function (m) { if (m.s === pos) html += m.open; });
            html += r.italic ? '<i>' + esc(r.text[k]) + '</i>' : esc(r.text[k]);
          }
          acc += r.text.length;
        });
        marks.forEach(function (m) { if (m.e >= acc) html += m.close; });
        html = html.replace(/<\/i><i>/g, '');
        var cls = [isHead ? 'heading' : '', afterRefs && !isHead ? 'ref' : '', p.inserted ? 'inserted' : '', sel && !sel.len ? 'sel' : ''].join(' ');
        return '<p data-i="' + i + '" contenteditable="true" class="' + cls + '"' + (p.bookmarks.length ? ' id="' + p.bookmarks[0] + '"' : '') + '>' + (p.highlight ? '<span class="hl">' + html + '</span>' : html) + '</p>';
      }).join('');
    }
    document.getElementById('page').addEventListener('focusout', function (e) {
      var el = e.target.closest('p[data-i]'); if (!el) return;
      var p = window.DemoDoc.paragraphs[+el.dataset.i], t = el.textContent;
      if (t === textOf(p)) return;
      p.runs = [{ text: t, italic: false }]; p.links = [];
      window.DemoDoc.listeners.forEach(function (cb) { cb(); });
      render();
    });
    document.getElementById('page').addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      var h = a.getAttribute('href');
      if (h[0] === '#') { e.preventDefault(); var t = document.getElementById(h.slice(1)); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.add('sel'); setTimeout(function () { t.classList.remove('sel'); }, 1200); } }
      else { e.preventDefault(); window.open(h, '_blank', 'noopener'); }
    });
    document.getElementById('sample').addEventListener('change', function (e) {
      window.DemoDoc.paragraphs = build(e.target.value); render();
      document.getElementById('pane').contentWindow.location.reload();
    });
    render();
  </script>
</body>
</html>
